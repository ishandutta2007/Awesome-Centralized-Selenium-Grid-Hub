<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00D2FF"/><stop offset="50%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#10B981"/></linearGradient><linearGradient id="hub-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-purple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="node-glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1f2937" stroke-width=".8" d="M 40 0 L 0 0 0 40" opacity=".6"/></pattern></defs><style>@keyframes pulse-pulse{0%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes flow-line{0%{stroke-dashoffset:100}}@keyframes float-node{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.orb-1{animation:pulse-pulse 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-2{animation:pulse-pulse 10s ease-in-out infinite alternate;transform-origin:1000px 300px}.node-pulse-1{animation:float-node 4s ease-in-out infinite}.node-pulse-2{animation:float-node 5s ease-in-out infinite 1s}.node-pulse-3{animation:float-node 4.5s ease-in-out infinite .5s}.data-stream,.data-stream-rev{stroke-dasharray:8 6;animation:flow-line 2.5s linear infinite}.data-stream-rev{animation:flow-line 3s linear infinite reverse}.body-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.body-text{font-weight:400}</style><rect width="1200" height="400" fill="url(#bg-grad)"/><circle cx="250" cy="120" r="140" fill="#00D2FF" class="orb-1" filter="url(#glow)" opacity=".15"/><circle cx="950" cy="260" r="160" fill="#8B5CF6" class="orb-2" filter="url(#glow)" opacity=".15"/><circle cx="600" cy="350" r="120" fill="#10B981" class="orb-1" filter="url(#glow)" opacity=".12"/><rect width="1200" height="400" fill="url(#grid)"/><g opacity=".55"><path fill="none" stroke="#00D2FF" stroke-width="2" d="M 600 290 L 350 250" class="data-stream"/><path fill="none" stroke="#10B981" stroke-width="2" d="M 600 290 L 850 250" class="data-stream-rev"/><path fill="none" stroke="#3B82F6" stroke-width="1.8" d="M 600 290 L 220 340" class="data-stream"/><path fill="none" stroke="#8B5CF6" stroke-width="1.8" d="M 600 290 L 980 340" class="data-stream-rev"/><path fill="none" stroke="#EC4899" stroke-width="2" d="M 600 290 L 600 375" class="data-stream"/><circle cx="600" cy="290" r="32" fill="#0f172a" stroke="#00D2FF" stroke-width="3" filter="url(#node-glow)"/><circle cx="600" cy="290" r="14" fill="#00D2FF" opacity=".8"/><g class="node-pulse-1"><circle cx="350" cy="250" r="22" fill="#0f172a" stroke="#3B82F6" stroke-width="2"/><circle cx="350" cy="250" r="8" fill="#3B82F6"/><text x="350" y="285" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Chrome Node</text></g><g class="node-pulse-2"><circle cx="850" cy="250" r="22" fill="#0f172a" stroke="#10B981" stroke-width="2"/><circle cx="850" cy="250" r="8" fill="#10B981"/><text x="850" y="285" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Firefox Node</text></g><g class="node-pulse-3"><circle cx="220" cy="340" r="18" fill="#0f172a" stroke="#00D2FF" stroke-width="2"/><circle cx="220" cy="340" r="6" fill="#00D2FF"/><text x="220" y="370" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Edge Node</text></g><g class="node-pulse-1"><circle cx="980" cy="340" r="18" fill="#0f172a" stroke="#8B5CF6" stroke-width="2"/><circle cx="980" cy="340" r="6" fill="#8B5CF6"/><text x="980" y="370" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Safari Node</text></g><g class="node-pulse-2"><circle cx="600" cy="375" r="14" fill="#0f172a" stroke="#EC4899" stroke-width="2"/><circle cx="600" cy="375" r="5" fill="#EC4899"/></g></g><g transform="translate(600, 52)"><rect width="280" height="28" x="-140" y="-14" fill="#1e293b" stroke="#38BDF8" stroke-width="1.2" opacity=".95" rx="14"/><circle cx="-118" cy="0" r="5" fill="#10B981"/><text x="0" y="4" fill="#38BDF8" class="body-text" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">REMOTE BROWSER ORCHESTRATION</text></g><text x="600" y="118" fill="url(#primary-glow)" class="title-text" font-size="38" text-anchor="middle">Awesome Centralized Selenium Grid Hub</text><text x="600" y="154" fill="#E2E8F0" class="body-text" font-size="17" font-weight="500" text-anchor="middle">Curated Hub Architecture, Cloud Test Grids &amp; Containerized Browser Clusters</text><g transform="translate(600, 195)"><rect width="135" height="25" x="-310" y="-12" fill="#1e293b" stroke="#475569" stroke-width="1" rx="12.5"/><text x="-242" y="5" fill="#CBD5E1" class="body-text" font-size="11" text-anchor="middle">⚡ Selenium Grid 4</text><rect width="140" height="25" x="-160" y="-12" fill="#1e293b" stroke="#475569" stroke-width="1" rx="12.5"/><text x="-90" y="5" fill="#CBD5E1" class="body-text" font-size="11" text-anchor="middle">☁️ SaaS Test Clouds</text><rect width="150" height="25" x="-5" y="-12" fill="#1e293b" stroke="#475569" stroke-width="1" rx="12.5"/><text x="70"